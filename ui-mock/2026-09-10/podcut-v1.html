<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const icon=n=>`<svg><use href="#i-${n}"/></svg>`;
const colors=['#cf7ba6','#70b7b1','#c8aa71'];
let tracks=[{name:'博宁',file:'Boning.wav',color:colors[0],muted:false,solo:false,volume:80},{name:'小周',file:'Xiaozhou.wav',color:colors[1],muted:false,solo:false,volume:80},{name:'片头音乐',file:'Intro.wav',color:colors[2],muted:false,solo:false,volume:42}];
let clips=[{id:1,track:0,start:0,end:38,label:'Boning.wav',muted:false},{id:2,track:0,start:44,end:82,label:'Boning.wav',muted:false},{id:3,track:1,start:14,end:49,label:'Xiaozhou.wav',muted:false},{id:4,track:1,start:55,end:84,label:'Xiaozhou.wav',muted:false},{id:5,track:2,start:0,end:17,label:'Intro.wav',muted:false}];
const paragraphs=[{track:0,start:0,end:14,text:'欢迎来到内容之间，我是博宁。今天想聊一个很日常的话题：在什么都越来越快的时候，我们为什么还愿意花一个小时，听两个人慢慢说话？'},{track:1,start:14,end:28,text:'我觉得，播客给了我们一种很难得的陪伴。你不需要一直盯着屏幕，也不用急着回应。走路的时候，做饭的时候，就让另一个人的声音在身边。'},{track:0,start:28,end:44,text:'对，我特别喜欢你说的“不用急着回应”。有时候，一段对话真正打动你的，反而是那些停顿，是一个人想了想，然后说出来的那句话。'},{track:1,start:44,end:62,text:'而且声音是有温度的。笑声、呼吸，甚至一点点犹豫，都能让你感觉到，这是一个真实的人，不是一段被反复打磨过的结论。'},{track:0,start:62,end:84,text:'所以今天，我们就从这些小小的声音开始。聊聊我们听过的节目，也聊聊那些让我们愿意一直听下去的瞬间。'}];
let words=[],wid=0,selectedWords=[],removed=[],hiddenTracks=new Set(),selectedClip=null,time=18.4,playing=false,preview=false,zoom=1,undo=[],redo=[],offset=0,nextId=6;
paragraphs.forEach((p,pi)=>{const parts=p.text.match(/[^，。？！、：]+[，。？！、：]?/g)||[p.text];let pos=0;parts.forEach(t=>{let start=p.start+(p.end-p.start)*pos/p.text.length;pos+=t.length;words.push({id:wid++,pi,track:p.track,text:t,start,end:p.start+(p.end-p.start)*pos/p.text.length})})});
function fmt(t,cs=false){return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}${cs?'.'+String(Math.floor(t%1*100)).padStart(2,'0'):''}`}
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),2600)}
function snapshot(){return JSON.stringify({clips,tracks,removed,offset})}function change(label,fn){undo.push({state:snapshot(),label});redo=[];fn();$('#saved').innerHTML='<i style="background:var(--gold)"></i>有未保存的更改';render();updateHistory()}
function restore(s){({clips,tracks,removed,offset}=JSON.parse(s));selectedClip=null;selectedWords=[];render()}
function updateHistory(){$('#undoBtn').disabled=!undo.length;$('#redoBtn').disabled=!redo.length;$('#historyLabel').textContent=undo.length?undo.at(-1).label:'编辑历史'}
function history(back){const from=back?undo:redo,to=back?redo:undo;if(!from.length)return;let item=from.pop();to.push({state:snapshot(),label:item.label});restore(item.state);updateHistory();$('#saved').innerHTML='<i style="background:var(--gold)"></i>有未保存的更改';toast((back?'已撤销：':'已重做：')+item.label)}
function renderText(){$('#paragraphs').innerHTML=paragraphs.map((p,pi)=>(hiddenTracks.has(p.track)||!tracks[p.track]||tracks[p.track].deleted)?'':`<div class="paragraph" style="--track:${tracks[p.track].color}"><div class="speaker"><i class="speaker-dot"></i><div><span class="speaker-name">${esc(tracks[p.track].name)}</span><div class="speaker-time">${fmt(Math.max(0,p.start+offset))}</div></div></div><div class="words">${words.filter(w=>w.pi===pi).map(w=>`<span class="word ${removed.includes(w.id)?'removed':''} ${selectedWords.includes(w.id)?'selected':''}" data-word="${w.id}">${w.text}</span>`).join('')}</div></div>`).join('');updateTime()}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderTimeline(){let pct=t=>t/84*100;$('#timeline').style.width=zoom*100+'%';$('#timeline').innerHTML=`<div class="ruler-row"><div class="ruler-label">音轨 / 音量</div><div class="ruler" id="ruler">${Array.from({length:8},(_,i)=>`<span style="left:${i*12.5+1}%">${fmt(i*10.5)}</span>`).join('')}</div></div>`+tracks.map((tr,ti)=>tr.deleted?'':`<div class="track-row" style="--track:${tr.color}"><div class="track-head"><div class="track-top">${icon('wave')}<span class="track-name" data-rename="${ti}" data-tip="双击重命名音轨">${esc(tr.name)}</span><button class="icon" style="width:17px;min-height:16px;height:16px;padding:0" data-remove-track="${ti}" data-tip="移除音轨" aria-label="移除 ${esc(tr.name)}">${icon('close')}</button></div><div class="track-controls"><button class="tiny ${tr.muted?'active':''}" data-mute="${ti}" aria-label="静音 ${esc(tr.name)}" aria-pressed="${tr.muted}">M</button><button class="tiny ${tr.solo?'active':''}" data-solo="${ti}" aria-label="独奏 ${esc(tr.name)}" aria-pressed="${tr.solo}">S</button><input type="range" min="0" max="100" value="${tr.volume}" data-volume="${ti}" aria-label="${esc(tr.name)} 音量"><span class="db">${tr.volume===0?'−∞':((tr.volume-80)/5).toFixed(1)}</span></div></div><div class="lane" data-lane="${ti}">${clips.filter(c=>c.track===ti).map(c=>`<div class="clip ${c.id===selectedClip?'chosen':''} ${c.muted||tr.muted||(tracks.some(t=>!t.deleted&&t.solo)&&!tr.solo)?'muted-clip':''}" data-clip="${c.id}" tabindex="0" role="button" aria-label="${esc(c.label)} ${fmt(c.start)} 至 ${fmt(c.end)}" style="left:${pct(c.start)}%;width:${pct(c.end-c.start)}%"><span class="clip-label">${esc(c.label)}${c.muted?' · 已静音':''}</span><canvas data-wave="${c.id}"></canvas></div>`).join('')}</div></div>`).join('')+'<div class="playhead" id="playhead"></div>';$('#trackCount').textContent=tracks.filter(t=>!t.deleted).length+' TRACKS';$('#infoTrackCount').textContent=tracks.filter(t=>!t.deleted).length+' 条';$('#selectionStatus').textContent=selectedClip?`已选中 ${clips.find(c=>c.id===selectedClip)?.label||'片段'}`:'未选择片段';$('#muteClipBtn').disabled=!selectedClip;$('#deleteBtn').disabled=!selectedClip;requestAnimationFrame(drawWaves);updateTime()}
function drawWaves(){$$('canvas[data-wave]').forEach(canvas=>{let c=clips.find(c=>c.id==canvas.dataset.wave);if(!c)return;let r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;let ctx=canvas.getContext('2d');ctx.scale(d,d);ctx.fillStyle=tracks[c.track].color;ctx.globalAlpha=.78;for(let x=2;x<r.width;x+=3){let n=Math.abs(Math.sin(x*1.27+c.id*9)*Math.cos(x*.049+c.id)*Math.sin(x*.21+3));let envelope=c.track===2?Math.min(1,x/35,(r.width-x)/80):.8+.2*Math.sin(x*.01);let h=Math.max(2,n*r.height*.92*envelope);ctx.fillRect(x,(r.height-h)/2,1.6,h)}})}
function updateTime(){$('#time').textContent=fmt(time,true);let r=$('#ruler');if(r&&$('#playhead'))$('#playhead').style.left=(r.offsetLeft+r.clientWidth*time/84)+'px';$$('.word').forEach(el=>{let w=words[+el.dataset.word];el.classList.toggle('current',time>=w.start+offset&&time<w.end+offset)})}
function seek(t){time=Math.max(0,Math.min(84,t));updateTime()}function togglePlay(){if(time>=84)time=0;playing=!playing;$('#playBtn').innerHTML=icon(playing?'pause':'play');$('#playBtn').setAttribute('aria-label',playing?'暂停':'播放');$('#app').classList.toggle('playing',playing)}
function render(){renderText();renderTimeline();$('#selectionToolbar').classList.remove('show')}
function split(){let c=clips.find(c=>c.id===selectedClip&&time>c.start+.2&&time<c.end-.2)||clips.find(c=>time>c.start+.2&&time<c.end-.2);if(!c){toast('将播放头移到片段内部后分割');return}change('分割片段',()=>{let end=c.end;c.end=time;clips.push({...c,id:nextId++,start:time,end});selectedClip=c.id})}
function muteClip(){let c=clips.find(c=>c.id===selectedClip);if(!c)return;change(c.muted?'恢复片段':'静音片段',()=>{c.muted=!c.muted;let ids=words.filter(w=>w.track===c.track&&w.start<c.end&&w.end>c.start).map(w=>w.id);removed=c.muted?[...new Set([...removed,...ids])]:removed.filter(id=>!ids.includes(id))})}
function removeClip(){if(!selectedClip)return;change('移除片段',()=>{clips=clips.filter(c=>c.id!==selectedClip);selectedClip=null})}
function save(){ $('#saved').innerHTML='<i></i>所有更改已保存';localStorage.setItem('podcut-mock-edit',snapshot());toast('演示项目已保存到此浏览器')}
$('#playBtn').onclick=togglePlay;$('#startBtn').onclick=()=>seek(0);$('#endBtn').onclick=()=>seek(84);$('#undoBtn').onclick=()=>history(true);$('#redoBtn').onclick=()=>history(false);$('#splitBtn').onclick=split;$('#muteClipBtn').onclick=muteClip;$('#deleteBtn').onclick=removeClip;$('#saveBtn').onclick=save;
$('#previewBtn').onclick=()=>{preview=!preview;$('#previewBtn').classList.toggle('active',preview);$('#previewBtn').setAttribute('aria-pressed',preview)};
let last=performance.now();function tick(now){if(playing){time=Math.min(84,time+(now-last)/1000);if(preview){let c=clips.find(c=>c.muted&&time>=c.start&&time<c.end);if(c)time=c.end}updateTime();if(time>=84)togglePlay()}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);
function menu(id,anchor){let m=$(id),was=m.classList.contains('open');$$('.menu').forEach(x=>x.classList.remove('open'));if(was)return;let r=anchor.getBoundingClientRect();m.style.top=r.bottom+7+'px';m.style.left=Math.min(r.left,innerWidth-225)+'px';m.classList.add('open')}
$('#projectMenuBtn').onclick=e=>{e.stopPropagation();menu('#projectMenu',e.currentTarget)};$('#layoutBtn').onclick=e=>{e.stopPropagation();menu('#layoutMenu',e.currentTarget)};$('#textOptions').onclick=e=>{e.stopPropagation();menu('#textMenu',e.currentTarget)};
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))$$('.menu').forEach(x=>x.classList.remove('open'))});
function swap(){let w=$('#workspace'),a=$('#transcriptPanel'),b=$('#audioPanel');let first=a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING?a:b;w.insertBefore(first===a?b:a,first);w.insertBefore($('#splitter'),first);saveLayout();drawWaves()}
function topTransport(){let t=$('#transportPanel');if(t.dataset.top==='true'){t.dataset.top='false';t.style.order='99';$('#app').append(t)}else{t.dataset.top='true';t.style.order='0';$('#app').insertBefore(t,$('#workspace'))}saveLayout()}
function saveLayout(){localStorage.setItem('podcut-mock-layout',JSON.stringify({audioFirst:!!($('#audioPanel').compareDocumentPosition($('#transcriptPanel'))&Node.DOCUMENT_POSITION_FOLLOWING),top:$('#transportPanel').dataset.top==='true'}))}
$$('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;$$('.menu').forEach(m=>m.classList.remove('open'));if(a==='save')save();if(a==='open')$('#projectInput').click();if(a==='import'||a==='reference'){$('#audioInput').dataset.mode=a;$('#audioInput').click()}if(a==='saveAs'){let blob=new Blob([snapshot()],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='podcut-demo.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('演示项目已另存为 JSON')}if(a==='swapLayout')swap();if(a==='topTransport')topTransport();if(a==='defaultLayout'){$('#workspace').append($('#transcriptPanel'),$('#splitter'),$('#audioPanel'));$('#app').append($('#transportPanel'));$('#transportPanel').dataset.top='false';$('#transportPanel').style.order='99';$('#transcriptPanel').style.flex='1.25';$('#audioPanel').style.flex='1';saveLayout();toast('已恢复默认布局')}if(a==='toggleMuted'){$('#transcriptScroll').classList.toggle('hide-muted');b.textContent=$('#transcriptScroll').classList.contains('hide-muted')?'显示已静音文字':'隐藏已静音文字'}if(a==='calibrate')$('#calibrateDialog').showModal()});
$('#exportBtn').onclick=()=>{$('#exportProgress').hidden=true;$('#confirmExport').disabled=false;$('#confirmExport').textContent='导出';$('#exportDialog').showModal()};$$('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());$$('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){let r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));
$('#confirmExport').onclick=()=>{let b=$('#confirmExport');b.disabled=true;b.textContent='正在导出…';$('#exportProgress').hidden=false;let p=0;clearInterval(window.exportTimer);window.exportTimer=setInterval(()=>{if(!$('#exportDialog').open){clearInterval(window.exportTimer);return}p+=10;$('#exportProgress div').style.width=p+'%';if(p>=100){clearInterval(window.exportTimer);$('#exportDialog').close();toast('导出流程演示完成 · 未生成真实音频文件')}},120)};
$('#fileInfo').onclick=$('#detailsBtn').onclick=()=>$('#infoDialog').showModal();$('#offset').oninput=e=>$('#offsetLabel').textContent=Number(e.target.value).toFixed(1)+' 秒';$('#applyOffset').onclick=()=>{change('校准文字时间',()=>offset=Number($('#offset').value));$('#calibrateDialog').close();toast('文字时间已调整')};
$('#generateBtn').onclick=()=>{let b=$('#generateBtn');b.disabled=true;b.innerHTML=icon('text')+'生成中…';$('#transcriptStatus').textContent='正在识别音频中的文字…';setTimeout(()=>{b.disabled=false;b.innerHTML=icon('text')+'生成文字';$('#transcriptStatus').textContent='文字已与音频对齐';renderText();toast('文字生成演示完成')},1600)};
$$('[data-filter]').forEach(b=>b.onclick=()=>{let i=+b.dataset.filter;hiddenTracks.has(i)?hiddenTracks.delete(i):hiddenTracks.add(i);b.style.opacity=hiddenTracks.has(i)?'.35':'1';renderText()});
$('#paragraphs').addEventListener('click',e=>{let el=e.target.closest('[data-word]');if(!el)return;if(window.getSelection()?.toString())return;let id=+el.dataset.word;seek(words[id].start+offset);if(e.shiftKey){selectedWords=[...new Set([...selectedWords,id])];renderText();showToolbar(el.getBoundingClientRect())}});
function showToolbar(r){let t=$('#selectionToolbar');t.style.left=Math.max(10,Math.min(r.left,innerWidth-280))+'px';t.style.top=Math.max(72,r.top-46)+'px';t.classList.add('show')}
$('#paragraphs').addEventListener('mouseup',()=>{setTimeout(()=>{let s=window.getSelection();if(!s||s.isCollapsed||!s.rangeCount)return;let range=s.getRangeAt(0);selectedWords=$$('[data-word]').filter(el=>range.intersectsNode(el)).map(el=>+el.dataset.word);if(selectedWords.length)showToolbar(range.getBoundingClientRect())},0)});
function editWords(mute){if(!selectedWords.length)return;let ids=[...selectedWords];change(mute?'静音文字片段':'恢复文字片段',()=>{removed=mute?[...new Set([...removed,...ids])]:removed.filter(id=>!ids.includes(id));let ranges=new Map();ids.forEach(id=>{let w=words[id],r=ranges.get(w.track)||{start:w.start,end:w.end};r.start=Math.min(r.start,w.start);r.end=Math.max(r.end,w.end);ranges.set(w.track,r)});ranges.forEach((r,track)=>{let result=[];clips.forEach(c=>{if(c.track!==track||c.end<=r.start||c.start>=r.end){result.push(c);return}if(c.start<r.start)result.push({...c,id:nextId++,end:r.start});result.push({...c,id:nextId++,start:Math.max(c.start,r.start),end:Math.min(c.end,r.end),muted:mute});if(c.end>r.end)result.push({...c,id:nextId++,start:r.end})});clips=result});selectedWords=[]});window.getSelection().removeAllRanges()}
$('#muteWords').onclick=()=>editWords(true);$('#restoreWords').onclick=()=>editWords(false);$('#clearWords').onclick=()=>{selectedWords=[];window.getSelection().removeAllRanges();renderText();$('#selectionToolbar').classList.remove('show')};
$('#timeline').addEventListener('click',e=>{let c=e.target.closest('[data-clip]');if(c){selectedClip=+c.dataset.clip;$$('.clip').forEach(el=>el.classList.toggle('chosen',+el.dataset.clip===selectedClip));$('#selectionStatus').textContent='已选中 '+clips.find(c=>c.id===selectedClip).label;$('#muteClipBtn').disabled=false;$('#deleteBtn').disabled=false;return}let lane=e.target.closest('.lane,.ruler');if(lane){let r=lane.getBoundingClientRect();seek((e.clientX-r.left)/r.width*84)}let m=e.target.closest('[data-mute]'),s=e.target.closest('[data-solo]'),d=e.target.closest('[data-remove-track]');if(m)change('音轨静音',()=>tracks[+m.dataset.mute].muted=!tracks[+m.dataset.mute].muted);if(s)change('音轨独奏',()=>tracks[+s.dataset.solo].solo=!tracks[+s.dataset.solo].solo);if(d){let i=+d.dataset.removeTrack;change('移除音轨',()=>{tracks[i].deleted=true;clips=clips.filter(c=>c.track!==i);selectedClip=null})}});
$('#timeline').addEventListener('dblclick',e=>{let n=e.target.closest('[data-rename]');if(!n)return;let i=+n.dataset.rename;n.contentEditable='true';n.focus();let old=tracks[i].name;n.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();n.blur()}if(e.key==='Escape'){n.textContent=old;n.blur()}};n.onblur=()=>{let name=n.textContent.trim()||old;if(name!==old)change('重命名音轨',()=>tracks[i].name=name);else n.contentEditable='false'}});
let volumeBefore=null;$('#timeline').addEventListener('input',e=>{if(e.target.matches('[data-volume]')){if(!volumeBefore)volumeBefore=snapshot();let t=tracks[+e.target.dataset.volume];t.volume=+e.target.value;e.target.nextElementSibling.textContent=t.volume===0?'−∞':((t.volume-80)/5).toFixed(1)}});$('#timeline').addEventListener('change',e=>{if(e.target.matches('[data-volume]')&&volumeBefore){undo.push({state:volumeBefore,label:'调整音量'});redo=[];volumeBefore=null;updateHistory();$('#saved').innerHTML='<i style="background:var(--gold)"></i>有未保存的更改'}});
$('#timeline').addEventListener('pointerdown',e=>{let el=e.target.closest('[data-clip]');if(!el||e.button!==0)return;let c=clips.find(c=>c.id===+el.dataset.clip),startX=e.clientX,start=c.start,len=c.end-c.start,width=el.parentElement.clientWidth,before=snapshot(),moved=false;selectedClip=c.id;el.setPointerCapture(e.pointerId);el.onpointermove=ev=>{let dx=ev.clientX-startX;if(Math.abs(dx)<4&&!moved)return;moved=true;let left=Math.max(0,Math.min(84-len,start+dx/width*84));c.start=Math.round(left*10)/10;c.end=c.start+len;el.style.left=c.start/84*100+'%';$('#selectionStatus').textContent=`${c.label} · ${fmt(c.start,true)}`};el.onpointerup=()=>{el.onpointermove=null;el.onpointerup=null;if(moved){undo.push({state:before,label:'移动片段'});redo=[];updateHistory();$('#saved').innerHTML='<i style="background:var(--gold)"></i>有未保存的更改'}renderTimeline()}});
$('#zoomIn').onclick=()=>{zoom=Math.min(3,zoom+.25);$('#zoomLabel').textContent=Math.round(zoom*100)+'%';renderTimeline()};$('#zoomOut').onclick=()=>{zoom=Math.max(1,zoom-.25);$('#zoomLabel').textContent=Math.round(zoom*100)+'%';renderTimeline()};
$('#importBtn').onclick=()=>$('#audioInput').click();$('#audioInput').onchange=e=>{let files=[...e.target.files];if(!files.length)return;change('添加音轨',()=>files.forEach(f=>{let i=tracks.length;tracks.push({name:f.name.replace(/\.[^.]+$/,''),file:f.name,color:colors[i%3],muted:false,solo:false,volume:80});clips.push({id:nextId++,track:i,start:0,end:50,label:f.name,muted:false})}));toast('已添加音轨外观 · 波形为演示数据');e.target.value=''};
$('#projectInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.clips)||!Array.isArray(data.tracks)||data.tracks.length<2||!Array.isArray(data.removed)||!Number.isFinite(data.offset)||data.tracks.some(t=>typeof t.name!=='string'||typeof t.color!=='string')||data.clips.some(c=>!Number.isFinite(c.start)||!Number.isFinite(c.end)||!data.tracks[c.track]))throw Error();change('打开演示项目',()=>{clips=data.clips;tracks=data.tracks;removed=data.removed;offset=data.offset;nextId=Math.max(...clips.map(c=>c.id),0)+1});toast('已打开演示项目')}catch{toast('请选择此 mock 另存为的 JSON 演示项目')}e.target.value=''};
let dragged=null;$$('[data-drag]').forEach(g=>g.addEventListener('dragstart',e=>{dragged=g.dataset.drag;e.dataTransfer.setData('text/plain',dragged);e.dataTransfer.effectAllowed='move';$('#'+dragged).classList.add('dragging')}));$$('[data-panel]').forEach(p=>{p.addEventListener('dragover',e=>{if(!dragged||p.id===dragged)return;e.preventDefault();p.classList.add('drop-target')});p.addEventListener('dragleave',e=>{if(!p.contains(e.relatedTarget))p.classList.remove('drop-target')});p.addEventListener('drop',e=>{e.preventDefault();p.classList.remove('drop-target');if(!dragged||dragged===p.id)return;if(dragged==='transportPanel'||p.id==='transportPanel')topTransport();else swap();toast('布局已更新')})});document.addEventListener('dragend',()=>{dragged=null;$$('.dragging,.drop-target').forEach(e=>e.classList.remove('dragging','drop-target'))});
$('#splitter').onpointerdown=e=>{let a=$('#transcriptPanel'),b=$('#audioPanel'),h=a.clientHeight+b.clientHeight,y=e.clientY,ah=a.clientHeight,sign=a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING?1:-1;$('#splitter').setPointerCapture(e.pointerId);$('#splitter').onpointermove=ev=>{let n=Math.max(190,Math.min(h-205,ah+(ev.clientY-y)*sign));a.style.flex=n+' 1 0';b.style.flex=(h-n)+' 1 0'};$('#splitter').onpointerup=()=>{$('#splitter').onpointermove=null;drawWaves()}};$('#splitter').onkeydown=e=>{if(!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();let a=$('#transcriptPanel'),b=$('#audioPanel'),h=a.clientHeight+b.clientHeight,n=Math.max(190,Math.min(h-205,a.clientHeight+(e.key==='ArrowDown'?25:-25)));a.style.flex=n+' 1 0';b.style.flex=(h-n)+' 1 0'};
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea')||e.target.isContentEditable||$$('dialog[open]').length)return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();history(!e.shiftKey);return}if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();save();return}if(e.code==='Space'){e.preventDefault();togglePlay()}if(e.key.toLowerCase()==='s')split();if(e.key.toLowerCase()==='m')muteClip();if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removeClip()}if(e.key==='ArrowLeft')seek(time-(e.shiftKey?5:1));if(e.key==='ArrowRight')seek(time+(e.shiftKey?5:1));if(e.key==='Escape'){$('#clearWords').click();$$('.menu').forEach(m=>m.classList.remove('open'));selectedClip=null;renderTimeline()}});
let tipTimer,tip;document.addEventListener('pointerover',e=>{let el=e.target.closest('[data-tip]');if(!el)return;clearTimeout(tipTimer);tipTimer=setTimeout(()=>{tip?.remove();tip=document.createElement('div');tip.className='tip';tip.textContent=el.dataset.tip;document.body.append(tip);let r=el.getBoundingClientRect(),tr=tip.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(innerWidth-tr.width-8,r.left+r.width/2-tr.width/2))+'px';tip.style.top=(r.bottom+tr.height+12>innerHeight?r.top-tr.height-7:r.bottom+7)+'px'},450)});document.addEventListener('pointerout',()=>{clearTimeout(tipTimer);tip?.remove()});document.addEventListener('pointerdown',()=>{clearTimeout(tipTimer);tip?.remove()});new ResizeObserver(()=>{drawWaves();updateTime()}).observe($('#workspace'));
render();try{let l=JSON.parse(localStorage.getItem('podcut-mock-layout'));if(l?.audioFirst)swap();if(l?.top)topTransport()}catch{}
