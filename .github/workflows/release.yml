name: macOS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/_code-quality.yml
  build:
    uses: ./.github/workflows/_build.yml
  unit:
    uses: ./.github/workflows/_unit-tests.yml
  integration:
    uses: ./.github/workflows/_integration-tests.yml
  users:
    uses: ./.github/workflows/_user-workflows.yml
  release:
    needs: [quality, build, unit, integration, users]
    runs-on: macos-15
    timeout-minutes: 120
    env:
      REDENCUT_MODELS_PATH: ${{ github.workspace }}/.runtime/release-models
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: npm
      - name: Verify platform, version and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/release/VerifyReleaseTag.mjs
      - name: Download this execution's compiled application
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: .
          merge-multiple: true
      - name: Verify compiled application source and checksums
        run: node scripts/ci/BuildArtifact.mjs verify
      - name: Check model credential
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node scripts/ci/CiEnvironment.mjs require-model-token
      - name: Install build prerequisites
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: node scripts/release/InstallMacPrerequisites.mjs
      - name: Install packaging dependencies
        run: npm ci
      - name: Build pinned runtime
        run: npm run setup:runtime
      - name: Prepare bundled diarization model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: npm run setup:models -- --model diarization-default
      - name: Verify bundled diarization model
        run: npm run check:models -- --model diarization-default
      - name: Package the verified build and verify release files
        run: npm run release:prepare -- --build-record dist-electron/build-record.json
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:draft
