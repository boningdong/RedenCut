name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/_code-quality.yml
  build:
    uses: ./.github/workflows/_build.yml
  unit:
    uses: ./.github/workflows/_unit-tests.yml
  integration:
    uses: ./.github/workflows/_integration-tests.yml
  users:
    uses: ./.github/workflows/_user-workflows.yml
  package:
    needs: [quality, build, unit, integration, users]
    uses: ./.github/workflows/_package-macos.yml
    with:
      build-artifact-id: ${{ needs.build.outputs.artifact-id }}
      require-tag: true
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
  publish:
    needs: [package]
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: npm
      - name: Verify platform, version and tag before publication
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/release/VerifyReleaseTag.mjs
      - name: Download this execution's verified release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: dist-electron/releases
          merge-multiple: true
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:draft
