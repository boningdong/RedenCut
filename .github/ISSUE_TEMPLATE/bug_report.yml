name: Bug report
description: Tell us what happened and how to reproduce it.
body:
  - type: markdown
    attributes:
      value: |
        Please search open and closed issues first using the action, symptom or error text.
        Use a plain title such as "Importing an MP3 stops at 50%"; feature names and prefixes are not required.
  - type: textarea
    id: steps
    attributes:
      label: What were you doing?
      description: A few steps we can follow. Mention whether it happens every time.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
      description: Include the visible error text or code, if there is one.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: App and OS versions
      placeholder: "RedenCut version; macOS/Windows/Linux version; Apple Silicon/Intel if known"
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Diagnostics or screenshots (optional)
      description: "Help → Collect diagnostics… or Settings → Diagnostics. Inspect the files, save the ZIP, then drag it here and wait for the upload to finish. Review for personal information before sharing."
