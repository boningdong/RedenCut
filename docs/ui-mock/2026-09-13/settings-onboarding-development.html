ate all ready',finish:'Your next great conversation<br>starts here.',finishLead:'Your workspace is ready. Explore a sample or start an empty project.',sample:'Open sample project',sampleHelp:'Explore text and audio together',import:'Import a recording',importHelp:'Choose an audio file from your computer',optionalLater:'Add speaker recognition anytime in Settings.',back:'Back',resourceHelp:'Download, check and manage local speech features.',manage:'Manage setup',recheck:'Check again',checked:'Check complete (simulated)',project:'Between the Lines · Episode 012',transcript:'Transcript',audio:'Audio',export:'Export',duration:'2 voice tracks',title:'Why we still listen to podcasts',sub:'BETWEEN THE LINES / EPISODE 012',undo:'Edit history',preview:'Skip muted',editorNotice:'Text editing is not ready yet. You can still explore the sample.',setupNow:'Set up now',emptyTitle:'Start with your first recording',emptySub:'Import audio to begin editing.',fileDemo:'File selected; this prototype does not read or process audio.',editorDemo:'This prototype focuses on settings and onboarding. Editor controls are visual only.',resumed:'Your appearance preferences are restored',optionalReady:'Speaker recognition is ready',downloadSpeaker:'Set up speaker recognition',speakerSize:'About 32 MB · demo estimate',authGranted:'Access granted (simulated)',verifyHelp:'Verify the files and run a check before marking this feature ready.',cancel:'Back to setup'}};

 saved.'):mode==='verifying'?t('verify'):t('progress')+' · '+percent+'%'}</p>`:''}</section>`}
function batchControl(keys,action,label,disabled=false){const active=mode!=='idle'&&keys.some(k=>selection.includes(k));if(active)return `<button class="download-action" data-action="${mode==='failed'||mode==='paused'?'resume':'pause'}" ${mode==='verifying'?'disabled':''}>${t(mode==='failed'?'retry':mode==='paused'?'resume':mode==='verifying'?'verify':'pause')}</button>`;if(keys.every(k=>components[k]))return '';return `<button class="download-action" data-action="${action}" aria-label="${label}" ${disabled||mode!=='idle'?'disabled':''}>${icon('download')}${tr('下载','Download')}</button>`}
function modelRow(k,title,engine,action=''){const active=mode!=='idle'&&selection.includes(k),moving=mode==='running'||mode==='verifying';return `<div class="model-row"><div class="row"><span>${title}</span><span class="model-engine">${engine}</span><div class="spacer"></div>${active&&action?batchControl([k],action,title):''}${active?`<span class="download-status ${mode==='failed'?'download-error':''}" role="progressbar" aria-label="${title} · ${mode==='failed'?t('failed'):mode==='paused'?tr('已暂停','Paused'):mode==='verifying'?t('verify'):t('progress')}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}" title="${mode==='failed'?t('failHelp'):mode==='verifying'?t('verify'):t('progress')}">${moving?'<i class="loading-spinner" aria-hidden="true"></i>':'<i class="status-dot" aria-hidden="true"></i>'}<span>${mode==='failed'?tr('中断','Interrupted')+' · ':mode==='paused'?tr('暂停','Paused')+' · ':mode==='verifying'?tr('校验','Verifying')+' · ':''}${percent}%</span></span>`:action&&!components[k]?batchControl([k],action,tr('下载说话人模型','Download speaker model')):status(componentState(k))}</div></div>`}
function staticModelRow(title,engine,state){return `<div class="model-row"><div class="row"><span>${title}</span><span class="model-engine">${engine}</span><div class="spacer"></div><span class="status pending"><i class="status-dot" aria-hidden="true"></i>${state}</span></div></div>`}
function speakerRows(unlocked){if(!unlocked)return `<div class="model-pair locked-models">${staticModelRow(tr('授权访问','Authorize access'),'Hugging Face',tr('待解锁','Locked'))}${staticModelRow(tr('说话人模型','Speaker model'),'pyannote',tr('需授权后下载','Authorize before downloading'))}</div>`;return `<div class="model-pair"><div class="model-row"><div class="row"><span>${tr('授权访问','Authorize access')}</span><span class="model-engine">Hugging Face</span><div class="spacer"></div>${granted?`<span class="status ready"><i class="status-dot" aria-hidden="true"></i>${tr('已授权','Authorized')}</span>`:`<button class="download-action" data-action="auth">${tr('授权','Authorize')} ↗</button>`}</div>${auth&&!granted?`<div class="auth"><p>${tr('在 Hugging Face 同意模型条款，并连接访问凭证。验证成功后即可下载。','Accept the model conditions on Hugging Face and connect your credentials. Download unlocks after verification.')}</p><div class="row"><a href="https://huggingface.co/pyannote/speaker-diarization-community-1" target="_blank" rel="noopener noreferrer">${t('authOpen')}</a><button class="outline" data-action="grant">${t('authDemo')}</button></div></div>`:''}</div>${granted?modelRow('diarization',tr('说话人模型','Speaker model'),'pyannote','speaker-download'):staticModelRow(tr('说话人模型','Speaker model'),'pyannote',tr('需授权后下载','Authorize before downloading'))}</div>`}
function resourcesHTML(settings=false){const coreReady=components.whisper&&components.alignment,unlocked=coreReady&&textEnabled&&speakerEnabled&&devReady(),busy=mode!=='idle';return `${settings?'':`<div class="resource-group"><div class="resource-heading"><div class="cap-icon">${icon('wave')}</div><div><h3>${t('edit')}</h3><p>${t('editHelp')}</p></div><div class="spacer"></div>${status(devAudioReady()?'ready':'need')}</div></div>`}${devEnvironmentHTML()}<div class="resource-group text-resource"><div class="resource-heading"><div class="cap-icon">${icon('text')}</div><div class="resource-title"><div class="toggle-heading"><h3>${settings?tr('文字剪辑模型','Text-editing models'):t('transcribe')}</h3><label class="toggle"><input type="checkbox" role="switch" data-change="text" aria-label="${t('transcribe')}" ${textEnabled?'checked':''} ${busy?'disabled':''}><span aria-hidden="true"></span></label></div><p>${tr('先准备文字与声音，再按需识别说话人。','Prepare text and audio first, then add speaker recognition.')}</p></div></div><div class="vertical-flow"><section class="flow-stage ${!textEnabled||!devReady()?'stage-locked':coreReady?'stage-complete':'stage-current'}"><div class="flow-heading"><span class="stage-marker">1</span><h3>${tr('文字识别与声音对齐模型','Transcription & alignment models')}</h3>${batchControl(['whisper','alignment'],'core-download',tr('下载基础模型','Download core models'),!textEnabled||!devReady())}${coreReady?`<span class="status ready">${tr('已完成','Complete')}</span>`:''}</div><p class="stage-description">${(!devReady()?tr('先完成上方开发环境配置，再下载模型。','Prepare the development environment above before downloading models.'):tr('准备转写模型与中英文对齐模型，已有文件自动跳过。','Prepare transcription and Chinese / English alignment models. Existing files are skipped.'))}</p><div class="model-pair">${modelRow('whisper',tr('文字识别模型','Transcription model'),'Whisper')}${modelRow('alignment',tr('声音对齐模型','Audio alignment model'),'Alignment')}</div></section><section class="flow-stage ${!unlocked?'stage-locked':components.diarization?'stage-complete':'stage-current'}"><div class="flow-heading"><span class="stage-marker">2</span><h3>${tr('说话人识别','Speaker recognition')}</h3><span class="pill">${t('optional')}</span><label class="toggle"><input type="checkbox" role="switch" data-change="speaker" aria-label="${tr('说话人识别','Speaker recognition')}" ${textEnabled&&speakerEnabled?'checked':''} ${busy||!textEnabled?'disabled':''}><span aria-hidden="true"></span></label></div><p class="stage-description">${!textEnabled?tr('启用文字剪辑后即可设置。','Enable text editing to set up this feature.'):!speakerEnabled?tr('已跳过。不自动区分说话人，仍可使用文字剪辑。','Skipped. Text editing works without speaker labels.'):!coreReady?tr('完成上方两项后解锁，先授权，再下载。','Unlocks after both models above are ready. Authorize access, then download.'):tr('先授权访问，再下载模型以区分说话人。','Authorize access, then download the model to identify speakers.')}</p>${textEnabled&&speakerEnabled?speakerRows(unlocked):''}</section></div></div>${settings?`<div class="resource-actions"><button class="outline" data-action="check">${t('recheck')}</button></div>`:''}`}
function resourceActions(){const complete=devAudioReady()&&(!textEnabled||(devReady()&&pref.ready&&(!speakerEnabled||components.diarization)));return `<div class="resource-actions"><button data-action="skip">${t('skip')}</button><button class="primary" data-action="done" ${!complete||mode!=='idle'?'disabled':''}>${t('continue')}${icon('arrow')}</button></div>`}
function renderSetup(){if(stage==='done'){renderDone();return}$('#setup').innerHTML=`<div class="setup-content"><div class="row"><div class="steps"><span>✓ ${t('welcomeStep')}</span><span class="line"></span><span class="current">${t('setupStep')}</span><span class="line"></span><span>${t('doneStep')}</span></div><div class="spacer"></div><button class="icon" data-action="skip" aria-label="${t('close')}">${icon('close')}</button></div><h2>${t('setupTitle')}</h2><p class="lead">${tr('先检查开发环境，再准备剪辑所需的模型。','Check your development environment, then prepare the editing models.')}</p><div class="setup-scroll">${resourcesHTML()}</div>${resourceActions()}</div>${demoFooter()}`}
function renderResources(){const setupScroll=$('#setup .setup-scroll')?.scrollTop||0,settingsScroll=$('#settings .settings-scroll')?.scrollTop||0;renderSetup();renderSettings();if($('#setup .setup-scroll'))$('#setup .setup-scroll').scrollTop=setupScroll;if($('#settings .settings-scroll'))$('#settings .settings-scroll').scrollTop=settingsScroll}
function renderDone(){ $('#setup').innerHTML=`<div class="setup-content"><div class="steps"><span>✓ ${t('welcomeStep')}</span><span class="line"></span><span>✓ ${t('setupStep')}</span><span class="line"></span><span class="current">${t('doneStep')}</span></div><div class="finish-mark">${icon('check')}</div><h2 class="center">${t('finish')}</h2><p class="lead center">${t('finishLead')}</p><div class="finish-options"><button class="finish-option" data-action="sample">${icon('play')}<b>${t('sample')}</b><small>${t('sampleHelp')}</small></button><button class="finish-option" data-action="empty">${icon('folder')}<b>${tr('从空项目开始','Start an empty project')}</b><small>${tr('创建项目，稍后添加录音','Create a project and add recordings later')}</small></button></div><p class="footnote center">${speakerEnabled&&pref.speaker?t('optionalReady'):t('optionalLater')}</p><div class="center" style="margin-top:20px"><button data-action="back">← ${t('back')}</button></div></div>${demoFooter(false)}`}
function renderSettings(){ $('#settings').innerHTML=`<div class="settings-layout"><nav class="settings-nav"><h3>${t('settings')}</h3><button data-action="tab" data-value="general" aria-current="${tab==='general'}">${icon('globe')}${t('general')}</button><button data-action="tab" data-value="theme" aria-current="${tab==='theme'}">${icon('palette')}${pref.lang==='zh'?'主题':'Theme'}</button><button data-action="tab" data-value="resources" aria-current="${tab==='resources'}">${icon('wave')}${t('resources')}</button><div class="spacer"></div><small class="muted" style="padding:10px">RedenCut · Development</small></nav><section class="settings-main"><div class="modal-heading"><h2>${t(tab)}</h2><button class="icon" data-action="closeSettings" aria-label="${t('close')}">${icon('close')}</button></div><div class="settings-scroll">${tab==='general'?`<div class="setting-row"><div><h3>${t('language')}</h3><p>${t('languageHelp')}</p></div>${langSelect()}</div>`:tab==='theme'?`<p class="muted" style="font-size:12px;margin-top:4px">${t('themeHelp')}</p><div class="theme-grid">${themes()}</div>`:`<p class="muted">${tr('管理开发环境与文字剪辑模型。','Manage the development environment and text-editing models.')}</p>${resourcesHTML(true)}`}</div></section></div>`}
function render(){apply();renderApp();renderWelcome();renderSettings();renderSetup()}
function openOnly(id){document.querySelectorAll('dialog[open]').forEach(d=>d.close());$('#'+id).showModal()}
function toast(key){$('#toast').textContent=t(key);$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3200)}
function exit(){if(mode==='running'||mode==='verifying'){clearInterval(timer);mode='paused'}document.querySelectorAll('dialog[open]').forEach(d=>d.close());pref.seen=true;save();renderApp()}
function download(which){if(!devReady())return;selection=(Array.isArray(which)?which:which?[which]:pending()).filter(k=>!components[k]);if(!selection.length)return;auth=false;percent=0;failedOnce=false;mode='running';tickStart();renderResources()}
function tickStart(){clearInterval(timer);timer=setInterval(()=>{if(mode==='verifying'){clearInterval(timer);selection.forEach(k=>components[k]=true);mode='idle';percent=0;selection=[];updateReady();renderResources();renderApp();return}percent=Math.min(100,percent+5);if(fail&&!failedOnce&&percent>=45){failedOnce=true;mode='failed';clearInterval(timer)}else if(percent===100)mode='verifying';renderResources()},240)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;switch(b.dataset.action){case 'theme':pref.theme=b.dataset.value;render();break;case 'settings':renderSettings();openOnly('settings');break;case 'closeSettings':$('#settings').close();break;case 'tab':tab=b.dataset.value;renderSettings();break;case 'welcome':devReset();clearInterval(timer);pref.ready=false;pref.speaker=false;pref.seen=false;components={whisper:false,alignment:false,diarization:false};textEnabled=true;speakerEnabled=true;selection=[];pref.components={...components};pref.granted=false;pref.speakerEnabled=true;pref.textEnabled=true;mode='idle';percent=0;failedOnce=false;fail=false;auth=false;granted=false;target='text';stage='setup';render();openOnly('welcome');break;case 'setup':stage='setup';renderSetup();openOnly('setup');break;case 'skip':exit();break;case 'core-download':if(textEnabled)download(['whisper','alignment']);break;case 'speaker-download':if(textEnabled&&speakerEnabled&&pref.ready&&granted)download('diarization');break;case 'download':download();break;case 'component-download':download(b.dataset.value);break;case 'resume':mode=percent===100?'verifying':'running';tickStart();renderResources();break;case 'pause':clearInterval(timer);mode='paused';renderResources();break;case 'auth':if(!pref.ready||!textEnabled||!speakerEnabled)break;auth=!auth;renderResources();break;case 'grant':if(!pref.ready||!textEnabled||!speakerEnabled)break;granted=true;speakerEnabled=true;auth=false;updateReady();renderResources();break;case 'allReady':devMakeReady();clearInterval(timer);components={whisper:true,alignment:true,diarization:true};granted=true;textEnabled=true;speakerEnabled=true;mode='idle';selection=[];percent=0;updateReady();render();break;case 'done':stage='done';renderSetup();break;case 'back':stage='setup';renderSetup();break;case 'sample':empty=false;exit();break;case 'empty':empty=true;exit();break;case 'file':$('#file').click();break;case 'editor':toast('editorDemo');break;case 'check':toast('checked');break}});
document.addEventListener('change',e=>{if(e.target.matches('[data-change=language]')){pref.lang=e.target.value;render()}if(e.target.id==='fail')fail=e.target.checked;if(e.target.matches('[data-change=text]')){textEnabled=e.target.checked;auth=false;updateReady();renderResources()}if(e.target.matches('[data-change=speaker]')){speakerEnabled=e.target.checked;auth=false;updateReady();renderResources()}if(e.target.id==='file'&&e.target.files.length){empty=true;exit();toast('fileDemo')}});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('cancel',e=>{e.preventDefault();if(d.id==='settings')d.close();else exit()}));

let devState={ffmpeg:true,ffprobe:true,whisper:false,uv:false,python:false,libraries:false,verified:false};
try{Object.assign(devState,JSON.parse(localStorage.getItem('redencut-dev-environment-v1')||'{}'))}catch{}
let devAvailable={ffmpeg:devState.ffmpeg,ffprobe:devState.ffprobe,whisper:devState.whisper,uv:devState.uv,python:devState.python,libraries:devState.libraries},devChecking='',devMessages={tools:'',runtime:''};
let devExpanded=!devReady(),devGuide='',devMode='idle',devPercent=0,devTimer=null,devFailure=false;
function devSave(){localStorage.setItem('redencut-dev-environment-v1',JSON.stringify(devState))}
function devAudioReady(){return devState.ffmpeg&&devState.ffprobe}
function devReady(){return devAudioReady()&&devState.whisper&&devState.python&&devState.libraries&&devState.verified}
function devReset(){clearInterval(devTimer);clearInterval(timer);mode='idle';selection=[];percent=0;devFailure=false;devState={ffmpeg:true,ffprobe:true,whisper:false,uv:false,python:false,libraries:false,verified:false};devAvailable={ffmpeg:true,ffprobe:true,whisper:false,uv:false,python:false,libraries:false};devMessages={tools:'',runtime:''};devChecking='';devMode='idle';devPercent=0;devGuide='';devExpanded=true;devSave()}
function devMakeReady(){clearInterval(devTimer);Object.keys(devState).forEach(k=>devState[k]=true);devMode='idle';devExpanded=false;devSave()}
function devRow(label,ready,active=false){return `<div class="dev-item"><span>${label}</span>${active?`<span class="download-status"><i class="loading-spinner" aria-hidden="true"></i>${devPercent}%</span>`:`<span class="status ${ready?'ready':'pending'}"><i class="status-dot" aria-hidden="true"></i>${ready?tr('已就绪','Ready'):tr('待准备','Not ready')}</span>`}</div>`}
function devEnvironmentHTML(){const ready=devReady(),working=['python','libraries','verify'].includes(devMode);return `<section class="dev-env"><button class="dev-summary" data-dev="expand" aria-expanded="${devExpanded}"><span class="cap-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/></svg></span><b>${tr('开发环境','Development environment')}</b><span class="pill">${tr('仅开发版','Development only')}</span><span class="dev-disclosure ${devExpanded?'is-expanded':''}" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m6 4 4 4-4 4"/></svg></span><span class="status ${ready?'ready':'pending'}"><i class="status-dot" aria-hidden="true"></i>${ready?tr('已就绪','Ready'):working?tr('正在准备','Preparing'):tr('需要配置','Setup required')}</span></button>${devExpanded?`<p class="dev-intro">${tr('检测本机工具，并为当前项目准备独立的 Python 环境。','Check local tools and prepare an isolated Python environment for this project.')}</p><div class="dev-grid"><section class="dev-block"><h3>${tr('本地工具','Local tools')}</h3><p>${tr('音频处理与文字识别所需的程序。','Programs for audio processing and transcription.')}</p>${devRow('FFmpeg',devState.ffmpeg)}${devRow('FFprobe',devState.ffprobe)}${devRow('whisper-cli',devState.whisper)}<div class="dev-block-footer"><span class="dev-note">${tr('检测系统与项目提供的版本','Checks system and project installations')}</span><button class="outline" data-dev="tools-guide">${tr('安装指引','Install guide')}</button><button class="download-action" data-dev="tools-validate" ${devChecking==='tools'?'disabled':''}>${devChecking==='tools'?tr('验证中…','Validating…'):tr('验证','Validate')}</button></div>${devFeedback('tools')}${devGuide==='tools'?`<div class="dev-guide">${tr('macOS · 已安装 Homebrew 时，在终端运行：','macOS · If Homebrew is installed, run in Terminal:')}<code>brew install ffmpeg whisper-cpp</code>${tr('ffmpeg 包含 ffprobe。安装后返回检查。','FFmpeg includes FFprobe. Return here after installation.')}<br><a href="https://brew.sh" target="_blank" rel="noopener noreferrer">${tr('Homebrew 安装说明','Homebrew installation')} ↗</a><button class="outline" data-dev="tools-check">${tr('模拟安装完成','Simulate installation')}</button></div>`:''}</section><section class="dev-block"><h3>${tr('Python 运行环境','Python runtime')}</h3><p>${tr('先安装 uv，再通过项目命令配置 Python 与依赖。','Install uv, then set up Python and dependencies with the project command.')}</p>${devRow('uv',devState.uv)}${devRow('Python 3.11',devState.python,devMode==='python')}${devRow(tr('语音处理组件','Speech libraries'),devState.libraries,devMode==='libraries')}<p class="dev-note">WhisperX · PyTorch · pyannote.audio</p>${devMode==='verify'?`<div class="dev-item"><span>${tr('检查组件加载','Checking imports')}</span><span class="download-status"><i class="loading-spinner"></i>${devPercent}%</span></div>`:''}${devMode==='failed'?`<div class="dev-error">${tr('组件下载中断，重试会复用已准备的 Python。','Library download interrupted. Retry reuses the prepared Python.')}</div>`:''}<div class="dev-block-footer"><span class="dev-note">${devState.verified?tr('组件加载检查通过','Import checks passed'):tr('当前项目 · .venv','This project · .venv')}</span><button class="outline" data-dev="uv-guide">${tr('安装指引','Install guide')}</button><button class="download-action" data-dev="runtime-validate" ${working||devChecking==='runtime'?'disabled':''}>${devChecking==='runtime'?tr('验证中…','Validating…'):tr('验证','Validate')}</button></div>${devFeedback('runtime')}${devGuide==='uv'?`<div class="dev-guide"><b>${tr('1. 安装 uv','1. Install uv')}</b><p>${tr('已安装可跳过。macOS 使用 Homebrew：','Skip if already installed. On macOS with Homebrew:')}</p><code>brew install uv</code><a href="https://docs.astral.sh/uv/getting-started/installation/" target="_blank" rel="noopener noreferrer">${tr('其他安装方式','Other installation methods')} ↗</a><div style="border-top:1px solid var(--subtle);margin-top:14px;padding-top:14px"><b>${tr('2. 配置开发环境','2. Set up the development environment')}</b><p>${tr('在 RedenCut 项目根目录打开终端，运行：','Open Terminal at the RedenCut project root and run:')}</p><code>npm run setup:speech</code><p>${tr('自动准备 Python 3.11、创建 .venv，并安装锁定版本的语音处理依赖。','Prepares Python 3.11, creates .venv, and installs locked speech dependencies.')}</p></div><p style="margin-top:12px">${tr('两步完成后，点击“验证”。模型在下方单独下载。','After both steps, click Validate. Models are downloaded separately below.')}</p><button class="outline" data-dev="runtime-installed">${tr('模拟两步已完成','Simulate both steps completed')}</button></div>`:''}</section></div><div class="dev-preview"><span>${tr('原型场景','Prototype scenarios')}</span><button data-dev="reset">${tr('重置环境','Reset environment')}</button><button data-dev="missing" ${working?'disabled':''}>${tr('工具全部缺失','All tools missing')}</button></div>`:''}</section>`}
function devFeedback(group){const value=devMessages[group];if(!value)return '';const messages={installed:tr('模拟安装已完成，点击“验证”更新检测结果。','Simulated installation finished. Validate to update detection.'),missing:tr('未检测到全部依赖，请查看安装指引后重试。','Some dependencies were not detected. Follow the install guide and retry.'),uv:tr('已检测到 uv，Python 环境尚未就绪。请完成安装指引中的第二步。','uv detected. The Python environment is not ready; complete step 2 in the install guide.'),ready:tr('验证通过，依赖已就绪。','Validation passed. Dependencies are ready.')};return `<p class="dev-note" role="status" style="margin:8px 0 0">${messages[value]}</p>`}
function devValidate(group){devChecking=group;devMessages[group]='';renderResources();setTimeout(()=>{if(devChecking!==group)return;if(group==='tools'){for(const k of ['ffmpeg','ffprobe','whisper'])devState[k]=devAvailable[k];devMessages.tools=devAudioReady()&&devState.whisper?'ready':'missing'}else{for(const k of ['uv','python','libraries'])devState[k]=devAvailable[k];devState.verified=devState.python&&devState.libraries;devMessages.runtime=devState.verified?'ready':devState.uv?'uv':'missing'}devChecking='';devSave();renderResources()},650)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-dev]');if(!b||b.disabled)return;switch(b.dataset.dev){case 'expand':devExpanded=!devExpanded;break;case 'tools-guide':devGuide=devGuide==='tools'?'':'tools';break;case 'uv-guide':devGuide=devGuide==='uv'?'':'uv';break;case 'tools-check':devAvailable.ffmpeg=true;devAvailable.ffprobe=true;devAvailable.whisper=true;devMessages.tools='installed';break;case 'uv-check':devAvailable.uv=true;devMessages.runtime='installed';break;case 'tools-validate':devValidate('tools');return;case 'runtime-validate':devValidate('runtime');return;case 'runtime-installed':devAvailable.uv=true;devAvailable.python=true;devAvailable.libraries=true;devMessages.runtime='installed';break;case 'reset':devReset();break;case 'missing':devReset();devState.ffmpeg=false;devState.ffprobe=false;devAvailable.ffmpeg=false;devAvailable.ffprobe=false;break}devSave();renderResources()});
document.addEventListener('change',e=>{if(e.target.matches('[data-dev-fail]'))devFailure=e.target.checked});
